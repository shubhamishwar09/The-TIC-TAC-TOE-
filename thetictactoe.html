                extend: {
                    fontFamily: {

    <style>
        /* Custom Theme Styles */
        .theme-modern {
            --bg-main: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --board-bg: rgba(30, 41, 59, 0.7);
            --cell-bg: rgba(51, 65, 85, 0.5);
            --cell-hover: rgba(71, 85, 105, 0.8);
            --text-main: #f8fafc;
            --color-x: #38bdf8;
            --color-o: #f43f5e;
            --glow-x: drop-shadow(0 0 8px rgba(56, 189, 248, 0.5));
            --glow-o: drop-shadow(0 0 8px rgba(244, 63, 94, 0.5));
            --border-color: rgba(255, 255, 255, 0.1);
        }

        .theme-neon {
            --bg-main: #05050a;
            --board-bg: rgba(15, 15, 30, 0.85);
            --cell-bg: #0d0d1a;
            --cell-hover: #1a1a3a;
            --text-main: #ffffff;
            --color-x: #00f2fe;
            --color-o: #ff0844;
            --glow-x: drop-shadow(0 0 12px #00f2fe);
            --glow-o: drop-shadow(0 0 12px #ff0844);
            --border-color: rgba(0, 242, 254, 0.3);
        }

        .theme-classic {
            --bg-main: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
            --board-bg: #ffffff;
            --cell-bg: #f1f5f9;
            --cell-hover: #e2e8f0;
            --text-main: #0f172a;
            --color-x: #2563eb;
            --color-o: #dc2626;
            --glow-x: none;
            --glow-o: none;
            --border-color: #cbd5e1;
        }

        body {
            background: var(--bg-main);
            color: var(--text-main);
            transition: background 0.4s ease, color 0.4s ease;
        }

        .game-board-container {
            background: var(--board-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(16px);
        }

        .board-cell {
            background: var(--cell-bg);
            border: 1px solid var(--border-color);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .board-cell:hover:not(:disabled) {
            background: var(--cell-hover);
            transform: translateY(-2px);
        }

        .symbol-x {
            color: var(--color-x);
            filter: var(--glow-x);
        }

        .symbol-o {
            color: var(--color-o);
            filter: var(--glow-o);
        }

        #winningLineCanvas,
        #confettiCanvas {
            pointer-events: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
        }

        @keyframes pulse-subtle {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.85;
                transform: scale(0.98);
            }
        }

        .active-turn-indicator {
            animation: pulse-subtle 2s infinite ease-in-out;
        }

        @keyframes pop-in {
            0% {
                transform: scale(0) rotate(-45deg);
                opacity: 0;
            }

            70% {
                transform: scale(1.15) rotate(10deg);
                opacity: 1;
            }

            100% {
                transform: scale(1) rotate(0deg);
            }
        }

        .animate-pop {
            animation: pop-in 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>

    <!-- Audio Synthesizer -->
    <script>
        class SoundEffects {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                }
            }

            playMove(isX) {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                const now = this.ctx.currentTime;
                if (isX) {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
                } else {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(330, now);
                    osc.frequency.exponentialRampToValueAtTime(220, now + 0.08);
                }

                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

                osc.start(now);
                osc.stop(now + 0.08);
            }

            playWin() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    const now = this.ctx.currentTime + (idx * 0.08);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now);

                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

                    osc.start(now);
                    osc.stop(now + 0.25);
                });
            }

            playTie() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                const now = this.ctx.currentTime;
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(150, now + 0.2);

                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        const soundFx = new SoundEffects();
    </script>

    <!-- Confetti Engine -->
    <script>
        class ConfettiEngine {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.animId = null;
                this.resize();

                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            trigger() {
                this.particles = [];
                const colors = ['#00f2fe', '#ff0844', '#38bdf8', '#f43f5e', '#a855f7', '#eab308'];

                for (let i = 0; i < 120; i++) {
                    this.particles.push({
                        x: this.canvas.width / 2 + (Math.random() - 0.5) * 100,
                        y: this.canvas.height / 2 + (Math.random() - 0.5) * 100,
                        vx: (Math.random() - 0.5) * 18,
                        vy: (Math.random() - 0.8) * 16 - 4,
                        size: Math.random() * 8 + 4,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        rotation: Math.random() * 360,
                        rSpeed: (Math.random() - 0.5) * 12,
                        opacity: 1
                    });
                }

                if (!this.animId) {
                    this.animate();
                }
            }

            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.35;
                    p.vx *= 0.98;
                    p.rotation += p.rSpeed;
                    p.opacity -= 0.008;

                    if (p.opacity <= 0) {
                        this.particles.splice(i, 1);
                        continue;
                    }

                    this.ctx.save();
                    this.ctx.globalAlpha = Math.max(0, p.opacity);
                    this.ctx.translate(p.x, p.y);
                    this.ctx.rotate((p.rotation * Math.PI) / 180);
                    this.ctx.fillStyle = p.color;
                    this.ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    this.ctx.restore();
                }

                if (this.particles.length > 0) {
                    this.animId = requestAnimationFrame(() => this.animate());
                } else {
                    this.animId = null;
                    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                }
            }
        }

        const confetti = new ConfettiEngine('confettiCanvas');
    </script>

    <!-- Core Game Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Configuration & State
            let gridSize = 3; // 3, 4, or 5
            let winTarget = 3; // 3 for 3x3, 4 for 4x4, 4 for 5x5
            let board = [];
            let currentPlayer = 'X';
            let isGameActive = true;
            let gameMode = 'pvp'; // 'pvp' or 'ai'
            let aiDifficulty = 'unbeatable'; // 'easy', 'medium', 'unbeatable'
            let scores = { X: 0, O: 0, ties: 0 };
            let winningSequence = null;
            let winningCombos = [];

            // DOM Elements
            const gameGrid = document.getElementById('gameGrid');
            const statusBanner = document.getElementById('statusBanner');
            const scoreX = document.getElementById('scoreX');
            const scoreO = document.getElementById('scoreO');
            const scoreTies = document.getElementById('scoreTies');
            const scoreBoxX = document.getElementById('scoreBoxX');
            const scoreBoxO = document.getElementById('scoreBoxO');
            const turnIndicatorX = document.getElementById('turnIndicatorX');
            const turnIndicatorO = document.getElementById('turnIndicatorO');
            const playerOText = document.getElementById('playerOText');
            const modePvpBtn = document.getElementById('modePvpBtn');
            const modeAiBtn = document.getElementById('modeAiBtn');
            const gridSizeBtns = document.querySelectorAll('.grid-size-btn');
            const aiDifficultyContainer = document.getElementById('aiDifficultyContainer');
            const diffBtns = document.querySelectorAll('.diff-btn');
            const resetGameBtn = document.getElementById('resetGameBtn');
            const resetScoresBtn = document.getElementById('resetScoresBtn');
            const soundToggleBtn = document.getElementById('soundToggleBtn');
            const soundIcon = document.getElementById('soundIcon');
            const themeMenuBtn = document.getElementById('themeMenuBtn');
            const themeDropdown = document.getElementById('themeDropdown');
            const themeOptions = document.querySelectorAll('.theme-option');
            const winningCanvas = document.getElementById('winningLineCanvas');
            const winCtx = winningCanvas.getContext('2d');

            // Initialize Combinations based on grid size & target win length
            function generateWinningCombinations(size, target) {
                const combos = [];
                // Rows
                for (let r = 0; r < size; r++) {
                    for (let c = 0; c <= size - target; c++) {
                        const line = [];
                        for (let k = 0; k < target; k++) {
                            line.push(r * size + (c + k));
                        }
                        combos.push(line);
                    }
                }
                // Columns
                for (let c = 0; c < size; c++) {
                    for (let r = 0; r <= size - target; r++) {
                        const line = [];
                        for (let k = 0; k < target; k++) {
                            line.push((r + k) * size + c);
                        }
                        combos.push(line);
                    }
                }
                // Main Diagonals (\)
                for (let r = 0; r <= size - target; r++) {
                    for (let c = 0; c <= size - target; c++) {
                        const line = [];
                        for (let k = 0; k < target; k++) {
                            line.push((r + k) * size + (c + k));
                        }
                        combos.push(line);
                    }
                }
                // Anti Diagonals (/)
                for (let r = 0; r <= size - target; r++) {
                    for (let c = target - 1; c < size; c++) {
                        const line = [];
                        for (let k = 0; k < target; k++) {
                            line.push((r + k) * size + (c - k));
                        }
                        combos.push(line);
                    }
                }
                return combos;
            }

            // Build Grid DOM & Reset Logic
            function initGrid() {
                winTarget = gridSize === 3 ? 3 : 4;
                winningCombos = generateWinningCombinations(gridSize, winTarget);
                board = Array(gridSize * gridSize).fill(null);

                // Update Grid Columns Style
                gameGrid.style.gridTemplateColumns = `repeat(${gridSize}, minmax(0, 1fr))`;
                gameGrid.innerHTML = '';

                // Dynamic font sizes based on grid density
                let fontSizeClass = 'text-4xl sm:text-5xl';
                if (gridSize === 4) fontSizeClass = 'text-2xl sm:text-3xl';
                if (gridSize === 5) fontSizeClass = 'text-xl sm:text-2xl';

                for (let i = 0; i < gridSize * gridSize; i++) {
                    const btn = document.createElement('button');
                    btn.setAttribute('data-index', i);
                    btn.className = `board-cell rounded-2xl flex items-center justify-center ${fontSizeClass} font-black font-tech focus:outline-none`;
                    btn.addEventListener('click', handleCellClick);
                    gameGrid.appendChild(btn);
                }

                restartRound();
            }

            // Canvas Line Drawer
            function resizeWinningCanvas() {
                const container = winningCanvas.parentElement;
                winningCanvas.width = container.clientWidth;
                winningCanvas.height = container.clientHeight;
                if (winningSequence) {
                    drawWinningLine(winningSequence);
                }
            }

            window.addEventListener('resize', resizeWinningCanvas);

            function drawWinningLine(combo) {
                winCtx.clearRect(0, 0, winningCanvas.width, winningCanvas.height);
                if (!combo) return;

                const cells = gameGrid.children;
                const firstCell = cells[combo[0]];
                const lastCell = cells[combo[combo.length - 1]];

                const rect1 = firstCell.getBoundingClientRect();
                const rect2 = lastCell.getBoundingClientRect();
                const containerRect = winningCanvas.parentElement.getBoundingClientRect();

                const x1 = rect1.left + rect1.width / 2 - containerRect.left;
                const y1 = rect1.top + rect1.height / 2 - containerRect.top;
                const x2 = rect2.left + rect2.width / 2 - containerRect.left;
                const y2 = rect2.top + rect2.height / 2 - containerRect.top;

                let progress = 0;
                function animateLine() {
                    if (progress > 1) progress = 1;
                    winCtx.clearRect(0, 0, winningCanvas.width, winningCanvas.height);

                    const currentX = x1 + (x2 - x1) * progress;
                    const currentY = y1 + (y2 - y1) * progress;

                    winCtx.beginPath();
                    winCtx.moveTo(x1, y1);
                    winCtx.lineTo(currentX, currentY);

                    const computedStyle = getComputedStyle(document.body);
                    const winnerColor = board[combo[0]] === 'X'
                        ? computedStyle.getPropertyValue('--color-x').trim() || '#00f2fe'
                        : computedStyle.getPropertyValue('--color-o').trim() || '#ff0844';

                    winCtx.strokeStyle = winnerColor;
                    winCtx.lineWidth = gridSize === 5 ? 5 : (gridSize === 4 ? 6 : 8);
                    winCtx.lineCap = 'round';
                    winCtx.shadowColor = winnerColor;
                    winCtx.shadowBlur = 12;
                    winCtx.stroke();

                    if (progress < 1) {
                        progress += 0.08;
                        requestAnimationFrame(animateLine);
                    }
                }
                animateLine();
            }

            function clearWinningLine() {
                winningSequence = null;
                winCtx.clearRect(0, 0, winningCanvas.width, winningCanvas.height);
            }

            // Gameplay Operations
            function handleCellClick(e) {
                const index = parseInt(e.currentTarget.getAttribute('data-index'));

                if (board[index] !== null || !isGameActive) return;

                makeMove(index, currentPlayer);

                if (isGameActive && gameMode === 'ai' && currentPlayer === 'O') {
                    isGameActive = false;
                    setTimeout(() => {
                        isGameActive = true;
                        makeAiMove();
                    }, 300);
                }
            }

            function makeMove(index, player) {
                board[index] = player;
                soundFx.playMove(player === 'X');

                const cell = gameGrid.children[index];
                cell.innerHTML = player === 'X'
                    ? `<span class="symbol-x animate-pop">X</span>`
                    : `<span class="symbol-o animate-pop">O</span>`;

                const winInfo = checkWinner(board);
                if (winInfo) {
                    endGame(winInfo.winner, winInfo.combo);
                } else if (board.every(val => val !== null)) {
                    endGame('tie');
                } else {
                    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                    updateTurnUI();
                }
            }

            function checkWinner(b) {
                for (let combo of winningCombos) {
                    const first = b[combo[0]];
                    if (!first) continue;

                    let isWin = true;
                    for (let i = 1; i < combo.length; i++) {
                        if (b[combo[i]] !== first) {
                            isWin = false;
                            break;
                        }
                    }
                    if (isWin) return { winner: first, combo };
                }
                return null;
            }

            function endGame(winner, combo = null) {
                isGameActive = false;

                if (winner === 'tie') {
                    scores.ties++;
                    statusBanner.innerHTML = `<span class="text-slate-300 font-bold font-tech text-sm sm:text-base">It's a Draw!</span>`;
                    soundFx.playTie();
                } else {
                    scores[winner]++;
                    winningSequence = combo;
                    drawWinningLine(combo);

                    const winnerLabel = (gameMode === 'ai' && winner === 'O') ? 'AI' : `Player ${winner}`;
                    const winnerClass = winner === 'X' ? 'symbol-x' : 'symbol-o';
                    statusBanner.innerHTML = `<span class="${winnerClass} font-bold font-tech text-sm sm:text-base">${winnerLabel} Wins! 🎉</span>`;

                    soundFx.playWin();
                    confetti.trigger();
                }

                updateScoreboard();
            }

            function updateTurnUI() {
                const isX = currentPlayer === 'X';

                if (isX) {
                    scoreBoxX.classList.add('active-turn-indicator');
                    scoreBoxX.classList.remove('opacity-60');
                    scoreBoxO.classList.remove('active-turn-indicator');
                    scoreBoxO.classList.add('opacity-60');
                    turnIndicatorX.classList.remove('opacity-0');
                    turnIndicatorO.classList.add('opacity-0');
                } else {
                    scoreBoxO.classList.add('active-turn-indicator');
                    scoreBoxO.classList.remove('opacity-60');
                    scoreBoxX.classList.remove('active-turn-indicator');
                    scoreBoxX.classList.add('opacity-60');
                    turnIndicatorO.classList.remove('opacity-0');
                    turnIndicatorX.classList.add('opacity-0');
                }

                const playerText = (gameMode === 'ai' && !isX) ? 'AI' : `Player ${currentPlayer}`;
                const playerClass = isX ? 'symbol-x' : 'symbol-o';
                statusBanner.innerHTML = `Turn: <span class="${playerClass} font-bold font-tech text-sm sm:text-base">${playerText}</span>`;
            }

            function updateScoreboard() {
                scoreX.textContent = scores.X;
                scoreO.textContent = scores.O;
                scoreTies.textContent = scores.ties;
            }

            function restartRound() {
                board = Array(gridSize * gridSize).fill(null);
                currentPlayer = 'X';
                isGameActive = true;
                clearWinningLine();

                if (gameGrid.children) {
                    Array.from(gameGrid.children).forEach(cell => cell.innerHTML = '');
                }

                updateTurnUI();
            }

            function resetAll() {
                scores = { X: 0, O: 0, ties: 0 };
                updateScoreboard();
                restartRound();
            }

            // Advanced AI Engine (Minimax with Depth-Limited Alpha-Beta Pruning for 4x4 & 5x5)
            function makeAiMove() {
                if (!isGameActive) return;

                const availableIndices = board.map((val, idx) => val === null ? idx : null).filter(val => val !== null);
                if (availableIndices.length === 0) return;

                let chosenIndex;

                if (aiDifficulty === 'easy') {
                    chosenIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
                } else if (aiDifficulty === 'medium') {
                    if (Math.random() < 0.55) {
                        chosenIndex = getBestMove();
                    } else {
                        chosenIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
                    }
                } else {
                    chosenIndex = getBestMove();
                }

                makeMove(chosenIndex, 'O');
            }

            function getBestMove() {
                const available = board.map((v, i) => v === null ? i : null).filter(v => v !== null);

                // Quick check: If AI can win in 1 move, take it immediately
                for (let idx of available) {
                    board[idx] = 'O';
                    if (checkWinner(board)) {
                        board[idx] = null;
                        return idx;
                    }
                    board[idx] = null;
                }

                // Quick check: If Player can win in 1 move, block it immediately
                for (let idx of available) {
                    board[idx] = 'X';
                    if (checkWinner(board)) {
                        board[idx] = null;
                        return idx;
                    }
                    board[idx] = null;
                }

                // Set max depth to prevent lag on larger grid trees
                let maxDepth = 6;
                if (gridSize === 4) maxDepth = 3;
                if (gridSize === 5) maxDepth = 2;

                let bestScore = -Infinity;
                let bestMove = available[0];

                for (let idx of available) {
                    board[idx] = 'O';
                    let score = minimaxAB(board, 0, false, -Infinity, Infinity, maxDepth);
                    board[idx] = null;

                    if (score > bestScore) {
                        bestScore = score;
                        bestMove = idx;
                    }
                }

                return bestMove;
            }

            function evaluateBoard(b) {
                let score = 0;
                for (let combo of winningCombos) {
                    let oCount = 0;
                    let xCount = 0;
                    for (let idx of combo) {
                        if (b[idx] === 'O') oCount++;
                        if (b[idx] === 'X') xCount++;
                    }
                    if (oCount > 0 && xCount === 0) score += Math.pow(10, oCount);
                    if (xCount > 0 && oCount === 0) score -= Math.pow(10, xCount);
                }
                return score;
            }

            function minimaxAB(b, depth, isMaximizing, alpha, beta, maxDepth) {
                const winInfo = checkWinner(b);
                if (winInfo) {
                    return winInfo.winner === 'O' ? (10000 - depth) : (-10000 + depth);
                }

                const available = b.map((v, i) => v === null ? i : null).filter(v => v !== null);
                if (available.length === 0) return 0;
                if (depth >= maxDepth) return evaluateBoard(b);

                if (isMaximizing) {
                    let maxEval = -Infinity;
                    for (let idx of available) {
                        b[idx] = 'O';
                        let evaluation = minimaxAB(b, depth + 1, false, alpha, beta, maxDepth);
                        b[idx] = null;
                        maxEval = Math.max(maxEval, evaluation);
                        alpha = Math.max(alpha, evaluation);
                        if (beta <= alpha) break;
                    }
                    return maxEval;
                } else {
                    let minEval = Infinity;
                    for (let idx of available) {
                        b[idx] = 'X';
                        let evaluation = minimaxAB(b, depth + 1, true, alpha, beta, maxDepth);
                        b[idx] = null;
                        minEval = Math.min(minEval, evaluation);
                        beta = Math.min(beta, evaluation);
                        if (beta <= alpha) break;
                    }
                    return minEval;
                }
            }

            // Event Listeners
            resetGameBtn.addEventListener('click', restartRound);
            resetScoresBtn.addEventListener('click', resetAll);

            // Grid Size Switcher
            gridSizeBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    gridSizeBtns.forEach(b => b.className = "grid-size-btn flex-1 py-1.5 text-xs font-bold rounded-xl transition-all text-slate-400 hover:text-white");
                    e.currentTarget.className = "grid-size-btn flex-1 py-1.5 text-xs font-bold rounded-xl transition-all bg-indigo-600 text-white shadow-md";
                    gridSize = parseInt(e.currentTarget.getAttribute('data-size'));
                    resetAll();
                    initGrid();
                });
            });

            // PvP / AI Mode Switcher
            modePvpBtn.addEventListener('click', () => {
                if (gameMode === 'pvp') return;
                gameMode = 'pvp';
                modePvpBtn.className = "flex-1 py-2 px-2 rounded-xl text-xs font-semibold transition-all flex items-center justify-center gap-1 bg-indigo-600 text-white shadow-md";
                modeAiBtn.className = "flex-1 py-2 px-2 rounded-xl text-xs font-semibold transition-all flex items-center justify-center gap-1 text-slate-400 hover:text-white";
                aiDifficultyContainer.classList.add('hidden');
                playerOText.textContent = 'Player O';
                resetAll();
            });

            modeAiBtn.addEventListener('click', () => {
                if (gameMode === 'ai') return;
                gameMode = 'ai';
                modeAiBtn.className = "flex-1 py-2 px-2 rounded-xl text-xs font-semibold transition-all flex items-center justify-center gap-1 bg-indigo-600 text-white shadow-md";
                modePvpBtn.className = "flex-1 py-2 px-2 rounded-xl text-xs font-semibold transition-all flex items-center justify-center gap-1 text-slate-400 hover:text-white";
                aiDifficultyContainer.classList.remove('hidden');
                playerOText.textContent = 'AI';
                resetAll();
            });

            // Difficulty Buttons
            diffBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    diffBtns.forEach(b => b.className = "diff-btn px-2.5 py-1 rounded-lg transition-all text-slate-400 hover:text-white");
                    e.currentTarget.className = "diff-btn px-2.5 py-1 rounded-lg transition-all bg-purple-600 text-white font-bold shadow-sm";
                    aiDifficulty = e.currentTarget.getAttribute('data-diff');
                    restartRound();
                });
            });

            // Sound Toggle
            soundToggleBtn.addEventListener('click', () => {
                soundFx.muted = !soundFx.muted;
                soundIcon.className = soundFx.muted ? 'fas fa-volume-mute text-lg text-rose-400' : 'fas fa-volume-up text-lg text-slate-300';
                if (!soundFx.muted) soundFx.playMove(true);
            });

            // Theme Dropdown Toggle
            themeMenuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                themeDropdown.classList.toggle('hidden');
            });

            document.addEventListener('click', () => themeDropdown.classList.add('hidden'));

            themeOptions.forEach(opt => {
                opt.addEventListener('click', (e) => {
                    const selectedTheme = e.currentTarget.getAttribute('data-theme');
                    document.body.className = `${selectedTheme} min-h-screen flex flex-col items-center justify-between p-4 sm:p-6 font-sans select-none overflow-x-hidden`;
                    themeDropdown.classList.add('hidden');
                    if (winningSequence) drawWinningLine(winningSequence);
                });
            });

            // Launch Initial Grid
            initGrid();
        });
    </script>
</body>
